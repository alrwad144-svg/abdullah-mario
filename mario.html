<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة ماريو</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Cairo', Arial, sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
        }
        canvas {
            display: block;
            border: 3px solid #333;
            image-rendering: pixelated;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 20px;
            text-shadow: 2px 2px 0 #000;
            z-index: 10;
        }

        /* ===== شاشة البداية ===== */
        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            overflow-y: auto;
            padding: 15px 0;
        }

        #startScreen .bg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(180deg, #1a0533 0%, #2d1b69 30%, #5C94FC 60%, #87CEEB 80%, #228B22 95%, #1a6b1a 100%);
            z-index: 0;
        }

        #startScreen .stars {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 60%;
            z-index: 1;
        }

        #startScreen .content {
            position: relative;
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 0;
        }

        #startScreen .title-box {
            background: rgba(0,0,0,0.5);
            border: 4px solid #fbd000;
            border-radius: 20px;
            padding: 10px 40px;
            margin-bottom: 5px;
            box-shadow: 0 0 40px rgba(251,208,0,0.3), inset 0 0 20px rgba(251,208,0,0.1);
        }

        #startScreen h1 {
            font-size: 40px;
            font-weight: 900;
            color: #e52521;
            text-shadow: 3px 3px 0 #000, -2px -2px 0 #fbd000, 0 0 30px rgba(229,37,33,0.5);
            margin-bottom: 0;
            letter-spacing: 3px;
        }

        #startScreen .subtitle {
            font-size: 16px;
            color: #fbd000;
            text-shadow: 1px 1px 0 #000;
            margin-top: 2px;
        }

        #startScreen .mario-art {
            font-size: 40px;
            margin: 2px 0;
            filter: drop-shadow(0 0 15px rgba(229,37,33,0.6));
            animation: bounce 1.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        #startScreen .info-cards {
            display: flex;
            gap: 10px;
            margin: 5px 0;
        }

        #startScreen .info-card {
            background: rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 8px 15px;
            color: white;
            font-size: 12px;
            backdrop-filter: blur(5px);
        }

        #startScreen .info-card .icon {
            font-size: 20px;
            margin-bottom: 2px;
        }

        #startScreen .controls-info {
            background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 8px 20px;
            margin: 5px 0;
            color: #ccc;
            font-size: 13px;
            line-height: 1.8;
        }

        #startScreen .controls-info kbd {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 5px;
            padding: 3px 10px;
            font-family: 'Cairo', monospace;
            color: #fff;
        }

        #startScreen .play-btn {
            margin-top: 8px;
            padding: 12px 50px;
            font-size: 22px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(180deg, #e52521, #b71c1c);
            color: white;
            border: 3px solid #fbd000;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(229,37,33,0.5);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 5px 20px rgba(229,37,33,0.5); }
            50% { box-shadow: 0 5px 40px rgba(229,37,33,0.8), 0 0 60px rgba(251,208,0,0.3); }
        }

        #startScreen .play-btn:hover {
            transform: scale(1.08);
            background: linear-gradient(180deg, #ff3333, #e52521);
        }

        #startScreen .credits {
            margin-top: 10px;
            margin-bottom: 5px;
            padding: 10px 30px;
            background: linear-gradient(135deg, rgba(251,208,0,0.25), rgba(229,37,33,0.25));
            border: 2px solid rgba(251,208,0,0.6);
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 25px rgba(251,208,0,0.2);
        }

        #startScreen .credits .designer-label {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        #startScreen .credits .designer-name {
            font-size: 26px;
            font-weight: 900;
            color: #fbd000;
            text-shadow: 1px 1px 0 #000, 0 0 10px rgba(251,208,0,0.5);
        }

        #startScreen .credits .designer-info {
            font-size: 14px;
            color: #ddd;
            margin-top: 5px;
            line-height: 1.8;
        }

        #startScreen .credits .designer-school {
            font-size: 13px;
            color: #87CEEB;
            margin-top: 3px;
        }

        /* ===== мобильные кнопки ===== */
        #mobileControls {
            display: none;
            position: fixed;
            bottom: 10px;
            width: 100%;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 30;
        }
        .ctrl-group {
            display: flex;
            gap: 10px;
        }
        .ctrl-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.15);
            color: white;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .ctrl-btn:active {
            background: rgba(255,255,255,0.4);
        }
        @media (max-width: 850px) {
            #mobileControls {
                display: flex;
            }
        }

        /* نجوم متحركة في الخلفية */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s ease-in-out infinite;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* عناصر متحركة في الخلفية */
        .floating-element {
            position: absolute;
            z-index: 2;
            animation: floatUpDown 3s ease-in-out infinite;
        }
        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .ground-deco {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
        <div id="ui">
            <div>💰 العملات: <span id="coinCount">0</span></div>
            <div>⭐ النقاط: <span id="score">0</span></div>
            <div>❤️ الأرواح: <span id="lives">3</span></div>
        </div>

        <div id="startScreen">
            <div class="bg"></div>
            <div class="stars" id="starsContainer"></div>

            <!-- عناصر متحركة -->
            <div class="floating-element" style="top:10%;left:8%;font-size:28px;animation-delay:0s">🍄</div>
            <div class="floating-element" style="top:20%;right:10%;font-size:24px;animation-delay:0.5s">⭐</div>
            <div class="floating-element" style="top:45%;left:5%;font-size:22px;animation-delay:1s">🪙</div>
            <div class="floating-element" style="top:40%;right:5%;font-size:24px;animation-delay:1.5s">🌟</div>
            <div class="floating-element" style="top:60%;left:10%;font-size:20px;animation-delay:0.8s">💎</div>
            <div class="floating-element" style="top:55%;right:10%;font-size:22px;animation-delay:1.2s">🐢</div>

            <div class="content">
                <div class="title-box">
                    <h1>🍄 سوبر ماريو 🍄</h1>
                    <div class="subtitle">SUPER MARIO BROS</div>
                </div>

                <div class="mario-art">🧱🍄⭐🪙</div>

                <div class="info-cards">
                    <div class="info-card">
                        <div class="icon">💰</div>
                        <div>اجمع العملات</div>
                    </div>
                    <div class="info-card">
                        <div class="icon">🐛</div>
                        <div>اقفز على الأعداء</div>
                    </div>
                    <div class="info-card">
                        <div class="icon">🏁</div>
                        <div> reached the flag</div>
                    </div>
                </div>

                <div class="controls-info">
                    <kbd>←</kbd> <kbd>→</kbd> للتحرك &nbsp;|&nbsp;
                    <kbd>Space</kbd> للقفز &nbsp;|&nbsp;
                    <kbd>R</kbd> إعادة اللعب
                </div>

                <button class="play-btn" onclick="startGame()">🎮 ابدأ اللعب! 🎮</button>

                <div class="credits">
                    <div class="designer-name">⭐ اسم المصمم: عبدالله عمر المسند</div>
                    <div class="designer-school">🏫 مدرسة الرواد الثانوية الأهليّة</div>
                </div>
            </div>
        </div>
    </div>

    <div id="mobileControls">
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btnLeft">◀</div>
            <div class="ctrl-btn" id="btnRight">▶</div>
        </div>
        <div class="ctrl-group">
            <div class="ctrl-btn" id="btnJump">▲</div>
        </div>
    </div>

    <script>
    // نجوم في الخلفية
    (function createStars() {
        const c = document.getElementById('starsContainer');
        for (let i = 0; i < 60; i++) {
            const s = document.createElement('div');
            s.className = 'star';
            s.style.left = Math.random() * 100 + '%';
            s.style.top = Math.random() * 100 + '%';
            let size = 2 + Math.random() * 3;
            s.style.width = size + 'px';
            s.style.height = size + 'px';
            s.style.animationDelay = (Math.random() * 3) + 's';
            s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
            c.appendChild(s);
        }
    })();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Game state
    let gameRunning = false;
    let keys = {};
    let camera = { x: 0 };
    let coins = 0;
    let score = 0;
    let lives = 3;
    let levelComplete = false;
    let gameOver = false;
    let particles = [];
    let frameCount = 0;

    const GROUND_Y = 420;
    const TILE = 40;

    let platforms = [];
    let coinItems = [];
    let enemies = [];
    let flag = {};

    function buildLevel() {
        platforms = [
            { x: 0, y: GROUND_Y, w: 2000, h: 80, color: '#8B4513', type: 'ground' },
            { x: 300, y: 320, w: 120, h: 20, color: '#228B22', type: 'platform' },
            { x: 500, y: 260, w: 100, h: 20, color: '#228B22', type: 'platform' },
            { x: 700, y: 300, w: 150, h: 20, color: '#228B22', type: 'platform' },
            { x: 950, y: 250, w: 100, h: 20, color: '#228B22', type: 'platform' },
            { x: 1150, y: 310, w: 120, h: 20, color: '#228B22', type: 'platform' },
            { x: 1400, y: 270, w: 130, h: 20, color: '#228B22', type: 'platform' },
            { x: 1650, y: 320, w: 100, h: 20, color: '#228B22', type: 'platform' },
            { x: 350, y: 370, w: 50, h: 50, color: '#00AA00', type: 'pipe' },
            { x: 850, y: 350, w: 50, h: 70, color: '#00AA00', type: 'pipe' },
            { x: 1300, y: 360, w: 50, h: 60, color: '#00AA00', type: 'pipe' },
        ];

        coinItems = [
            { x: 320, y: 280, collected: false },
            { x: 350, y: 280, collected: false },
            { x: 380, y: 280, collected: false },
            { x: 520, y: 220, collected: false },
            { x: 550, y: 220, collected: false },
            { x: 730, y: 260, collected: false },
            { x: 760, y: 260, collected: false },
            { x: 970, y: 210, collected: false },
            { x: 1000, y: 210, collected: false },
            { x: 1170, y: 270, collected: false },
            { x: 1200, y: 270, collected: false },
            { x: 1420, y: 230, collected: false },
            { x: 1450, y: 230, collected: false },
            { x: 1670, y: 280, collected: false },
            { x: 150, y: 380, collected: false },
            { x: 200, y: 380, collected: false },
            { x: 600, y: 380, collected: false },
            { x: 1100, y: 380, collected: false },
            { x: 1500, y: 380, collected: false },
            { x: 1550, y: 380, collected: false },
        ];

        enemies = [
            { x: 250, y: GROUND_Y - 30, w: 35, h: 30, dir: 1, speed: 1.5, type: 'goomba' },
            { x: 600, y: GROUND_Y - 30, w: 35, h: 30, dir: -1, speed: 1.5, type: 'goomba' },
            { x: 1000, y: GROUND_Y - 30, w: 35, h: 30, dir: 1, speed: 2, type: 'goomba' },
            { x: 1250, y: GROUND_Y - 30, w: 35, h: 30, dir: -1, speed: 1.5, type: 'goomba' },
            { x: 1550, y: GROUND_Y - 30, w: 35, h: 30, dir: 1, speed: 2, type: 'goomba' },
            { x: 1800, y: GROUND_Y - 30, w: 35, h: 30, dir: -1, speed: 1.5, type: 'goomba' },
        ];

        flag = { x: 1900, y: GROUND_Y - 150, h: 150 };
    }

    let mario = {
        x: 50, y: GROUND_Y - 40, w: 30, h: 40,
        vx: 0, vy: 0,
        onGround: false,
        facing: 1,
        frame: 0,
        animTimer: 0,
        invincible: 0,
        dead: false
    };

    function resetMario() {
        mario.x = 50;
        mario.y = GROUND_Y - 40;
        mario.vx = 0;
        mario.vy = 0;
        mario.onGround = false;
        mario.facing = 1;
        mario.invincible = 60;
        mario.dead = false;
    }

    document.addEventListener('keydown', e => { keys[e.code] = true; });
    document.addEventListener('keyup', e => { keys[e.code] = false; });

    function setupMobile() {
        const btnLeft = document.getElementById('btnLeft');
        const btnRight = document.getElementById('btnRight');
        const btnJump = document.getElementById('btnJump');
        const handle = (el, key, state) => {
            el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = state; });
            el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
        };
        handle(btnLeft, 'ArrowLeft', true);
        handle(btnRight, 'ArrowRight', true);
        handle(btnJump, 'Space', true);
    }
    setupMobile();

    function spawnParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 6,
                vy: -Math.random() * 5 - 2,
                life: 30 + Math.random() * 20,
                color,
                size: 3 + Math.random() * 4
            });
        }
    }

    function updateMario() {
        if (mario.dead) return;
        const speed = 4;
        const gravity = 0.5;
        const jumpForce = -11;

        if (keys['ArrowLeft'] || keys['KeyA']) {
            mario.vx = -speed;
            mario.facing = -1;
        } else if (keys['ArrowRight'] || keys['KeyD']) {
            mario.vx = speed;
            mario.facing = 1;
        } else {
            mario.vx *= 0.8;
            if (Math.abs(mario.vx) < 0.1) mario.vx = 0;
        }

        if ((keys['Space'] || keys['ArrowUp'] || keys['KeyW']) && mario.onGround) {
            mario.vy = jumpForce;
            mario.onGround = false;
            spawnParticles(mario.x + mario.w/2, mario.y + mario.h, '#ccc', 5);
        }

        mario.vy += gravity;
        mario.x += mario.vx;
        if (mario.x < 0) mario.x = 0;
        mario.y += mario.vy;
        mario.onGround = false;

        for (let p of platforms) {
            if (mario.x + mario.w > p.x && mario.x < p.x + p.w) {
                if (mario.vy >= 0 && mario.y + mario.h > p.y && mario.y + mario.h < p.y + p.h + 20) {
                    mario.y = p.y - mario.h;
                    mario.vy = 0;
                    mario.onGround = true;
                }
            }
        }

        if (mario.y > canvas.height + 50) loseLife();

        mario.animTimer++;
        if (mario.animTimer > 6) {
            mario.animTimer = 0;
            mario.frame = (mario.frame + 1) % 3;
        }
        if (mario.invincible > 0) mario.invincible--;
    }

    function updateEnemies() {
        for (let e of enemies) {
            if (e.dead) continue;
            e.x += e.speed * e.dir;
            for (let p of platforms) {
                if (e.x + e.w > p.x + p.w || e.x < p.x) {
                    if (e.y + e.h >= p.y - 5 && e.y + e.h <= p.y + 10) e.dir *= -1;
                }
            }
            if (!mario.dead && mario.invincible <= 0) {
                if (mario.x + mario.w > e.x && mario.x < e.x + e.w &&
                    mario.y + mario.h > e.y && mario.y < e.y + e.h) {
                    if (mario.vy > 0 && mario.y + mario.h < e.y + e.h / 2) {
                        e.dead = true;
                        mario.vy = -8;
                        score += 100;
                        spawnParticles(e.x + e.w/2, e.y, '#8B4513', 8);
                        updateUI();
                    } else {
                        loseLife();
                    }
                }
            }
        }
    }

    function updateCoins() {
        for (let c of coinItems) {
            if (c.collected) continue;
            if (mario.x + mario.w > c.x && mario.x < c.x + 15 &&
                mario.y + mario.h > c.y && mario.y < c.y + 15) {
                c.collected = true;
                coins++;
                score += 50;
                spawnParticles(c.x + 7, c.y + 7, '#FFD700', 6);
                updateUI();
            }
        }
    }

    function checkFlag() {
        if (mario.x + mario.w > flag.x - 10 && mario.x < flag.x + 20) {
            levelComplete = true;
            score += 500;
            updateUI();
        }
    }

    function loseLife() {
        lives--;
        updateUI();
        if (lives <= 0) gameOver = true;
        else resetMario();
    }

    function updateUI() {
        document.getElementById('coinCount').textContent = coins;
        document.getElementById('score').textContent = score;
        document.getElementById('lives').textContent = lives;
    }

    // ===== الرسم =====
    function drawBackground() {
        let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, '#5C94FC');
        grad.addColorStop(0.7, '#87CEEB');
        grad.addColorStop(1, '#B0E0E6');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = 'rgba(255,255,255,0.8)';
        drawCloud(100 - camera.x * 0.1, 60, 1.2);
        drawCloud(400 - camera.x * 0.1, 40, 0.8);
        drawCloud(700 - camera.x * 0.1, 80, 1);
        drawCloud(1100 - camera.x * 0.1, 50, 1.1);
        drawCloud(1500 - camera.x * 0.1, 70, 0.9);

        ctx.fillStyle = '#228B22';
        for (let i = 0; i < 6; i++) {
            let hx = i * 350 - camera.x * 0.3;
            ctx.beginPath();
            ctx.moveTo(hx, GROUND_Y);
            ctx.quadraticCurveTo(hx + 100, GROUND_Y - 100, hx + 200, GROUND_Y);
            ctx.fill();
        }

        ctx.fillStyle = '#2E8B57';
        for (let i = 0; i < 8; i++) {
            let bx = i * 260 + 50 - camera.x * 0.5;
            ctx.beginPath();
            ctx.arc(bx, GROUND_Y, 25, 0, Math.PI * 2);
            ctx.arc(bx + 20, GROUND_Y - 5, 20, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawCloud(x, y, scale) {
        ctx.save();
        ctx.translate(x, y);
        ctx.scale(scale, scale);
        ctx.beginPath();
        ctx.arc(0, 0, 25, 0, Math.PI * 2);
        ctx.arc(25, -5, 30, 0, Math.PI * 2);
        ctx.arc(50, 0, 25, 0, Math.PI * 2);
        ctx.arc(25, 5, 20, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }

    function drawPlatforms() {
        for (let p of platforms) {
            let sx = p.x - camera.x;
            if (sx > canvas.width + 100 || sx + p.w < -100) continue;

            if (p.type === 'ground') {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(sx, p.y, p.w, p.h);
                ctx.fillStyle = '#228B22';
                ctx.fillRect(sx, p.y, p.w, 8);
                ctx.strokeStyle = '#6B3410';
                ctx.lineWidth = 1;
                for (let bx = sx; bx < sx + p.w; bx += 40) {
                    for (let by = p.y + 8; by < p.y + p.h; by += 20) {
                        ctx.strokeRect(bx, by, 40, 20);
                    }
                }
            } else if (p.type === 'pipe') {
                ctx.fillStyle = '#00CC00';
                ctx.fillRect(sx, p.y, p.w, p.h);
                ctx.fillStyle = '#008800';
                ctx.fillRect(sx, p.y, 8, p.h);
                ctx.fillStyle = '#00AA00';
                ctx.fillRect(sx + p.w - 12, p.y, 12, p.h);
                ctx.fillStyle = '#00DD00';
                ctx.fillRect(sx - 5, p.y, p.w + 10, 12);
                ctx.fillStyle = '#009900';
                ctx.fillRect(sx - 5, p.y, 6, 12);
            } else {
                ctx.fillStyle = p.color;
                ctx.fillRect(sx, p.y, p.w, p.h);
                ctx.fillStyle = '#196619';
                ctx.fillRect(sx, p.y + p.h - 5, p.w, 5);
                ctx.strokeStyle = '#0D4D0D';
                ctx.lineWidth = 1;
                for (let bx = sx; bx < sx + p.w; bx += 30) {
                    ctx.strokeRect(bx, p.y, 30, p.h);
                }
            }
        }
    }

    function drawMario() {
        if (mario.dead) return;
        if (mario.invincible > 0 && Math.floor(mario.invincible / 3) % 2 === 0) return;

        let sx = mario.x - camera.x;
        let sy = mario.y;
        let f = mario.facing;

        ctx.save();
        ctx.translate(sx + mario.w/2, sy + mario.h/2);
        ctx.scale(f, 1);

        ctx.fillStyle = '#E52521';
        ctx.fillRect(-8, -5, 16, 15);
        ctx.fillStyle = '#0000AA';
        ctx.fillRect(-8, 8, 16, 12);
        ctx.fillStyle = '#FFB366';
        ctx.fillRect(-7, -16, 14, 12);
        ctx.fillStyle = '#E52521';
        ctx.fillRect(-9, -20, 18, 6);
        ctx.fillRect(-5, -22, 14, 4);
        ctx.fillStyle = '#000';
        ctx.fillRect(2, -13, 3, 3);
        ctx.fillStyle = '#5C3A1E';
        ctx.fillRect(-1, -9, 8, 2);

        ctx.fillStyle = '#0000AA';
        if (!mario.onGround) {
            ctx.fillRect(-8, 16, 7, 6);
            ctx.fillRect(1, 14, 7, 8);
        } else if (Math.abs(mario.vx) > 0.5) {
            let legOffset = Math.sin(mario.frame * 2) * 5;
            ctx.fillRect(-6 + legOffset, 18, 6, 6);
            ctx.fillRect(1 - legOffset, 18, 6, 6);
        } else {
            ctx.fillRect(-6, 18, 6, 6);
            ctx.fillRect(0, 18, 6, 6);
        }

        ctx.fillStyle = '#8B4513';
        ctx.fillRect(-7, 23, 7, 4);
        ctx.fillRect(0, 23, 7, 4);

        ctx.fillStyle = '#FFB366';
        if (!mario.onGround) {
            ctx.fillRect(-12, -8, 5, 4);
            ctx.fillRect(7, -8, 5, 4);
        } else {
            ctx.fillRect(-12, -2, 5, 10);
            ctx.fillRect(7, -2, 5, 10);
        }

        ctx.restore();
    }

    function drawEnemies() {
        for (let e of enemies) {
            if (e.dead) continue;
            let sx = e.x - camera.x;
            if (sx > canvas.width + 50 || sx < -50) continue;

            ctx.save();
            ctx.translate(sx + e.w/2, e.y + e.h/2);

            if (e.type === 'goomba') {
                ctx.fillStyle = '#8B4513';
                ctx.beginPath();
                ctx.ellipse(0, 0, 17, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#A0522D';
                ctx.beginPath();
                ctx.ellipse(0, -5, 15, 10, 0, Math.PI, 0);
                ctx.fill();
                ctx.fillStyle = 'white';
                ctx.fillRect(-10, -8, 8, 8);
                ctx.fillRect(2, -8, 8, 8);
                ctx.fillStyle = 'black';
                ctx.fillRect(-7, -6, 4, 5);
                ctx.fillRect(5, -6, 4, 5);
                ctx.fillStyle = '#000';
                ctx.fillRect(-10, -11, 8, 2);
                ctx.fillRect(2, -11, 8, 2);
                ctx.fillStyle = '#000';
                let feetOffset = Math.sin(frameCount * 0.15) * 3;
                ctx.fillRect(-14 + feetOffset, 10, 10, 5);
                ctx.fillRect(4 - feetOffset, 10, 10, 5);
            }
            ctx.restore();
        }
    }

    function drawCoins() {
        for (let c of coinItems) {
            if (c.collected) continue;
            let sx = c.x - camera.x;
            if (sx > canvas.width + 20 || sx < -20) continue;
            let bounce = Math.sin(frameCount * 0.08 + c.x) * 3;
            ctx.save();
            ctx.translate(sx + 7, c.y + 7 + bounce);
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(0, 0, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFA500';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 10px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('$', 0, 0);
            ctx.restore();
        }
    }

    function drawFlag() {
        let sx = flag.x - camera.x;
        ctx.fillStyle = '#888';
        ctx.fillRect(sx, flag.y, 6, flag.h);
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(sx + 3, flag.y, 8, 0, Math.PI * 2);
        ctx.fill();
        let wave = Math.sin(frameCount * 0.05) * 5;
        ctx.fillStyle = '#00AA00';
        ctx.beginPath();
        ctx.moveTo(sx + 6, flag.y + 10);
        ctx.lineTo(sx + 45 + wave, flag.y + 30);
        ctx.lineTo(sx + 6, flag.y + 50);
        ctx.closePath();
        ctx.fill();
        ctx.fillStyle = '#FFD700';
        ctx.font = '16px Arial';
        ctx.fillText('★', sx + 15, flag.y + 35);
    }

    function drawParticles() {
        for (let p of particles) {
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.life / 50;
            ctx.fillRect(p.x - camera.x, p.y, p.size, p.size);
        }
        ctx.globalAlpha = 1;
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.2;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function drawGameOver() {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#E52521';
        ctx.font = 'bold 48px Cairo, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', canvas.width/2, canvas.height/2 - 20);
        ctx.fillStyle = 'white';
        ctx.font = '24px Cairo, Arial';
        ctx.fillText('النقاط: ' + score, canvas.width/2, canvas.height/2 + 20);
        ctx.fillText('اضغط R للإعادة', canvas.width/2, canvas.height/2 + 60);
    }

    function drawLevelComplete() {
        ctx.fillStyle = 'rgba(0,0,0,0.7)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#FFD700';
        ctx.font = 'bold 48px Cairo, Arial';
        ctx.textAlign = 'center';
        ctx.fillText('🎉 مبروك! 🎉', canvas.width/2, canvas.height/2 - 30);
        ctx.fillStyle = 'white';
        ctx.font = '28px Cairo, Arial';
        ctx.fillText('لقد فزت!', canvas.width/2, canvas.height/2 + 10);
        ctx.font = '22px Cairo, Arial';
        ctx.fillText('النقاط: ' + score + ' | العملات: ' + coins, canvas.width/2, canvas.height/2 + 50);
        ctx.fillText('اضغط R للإعادة', canvas.width/2, canvas.height/2 + 90);
    }

    // ===== الحلقة الرئيسية =====
    function gameLoop() {
        if (!gameRunning) return;
        frameCount++;

        if (keys['KeyR']) { restartGame(); return; }

        if (!gameOver && !levelComplete) {
            updateMario();
            updateEnemies();
            updateCoins();
            checkFlag();
            updateParticles();
            let targetCam = mario.x - canvas.width / 3;
            camera.x += (targetCam - camera.x) * 0.1;
            if (camera.x < 0) camera.x = 0;
        }

        drawBackground();
        drawPlatforms();
        drawCoins();
        drawFlag();
        drawEnemies();
        drawMario();
        drawParticles();

        if (gameOver) drawGameOver();
        if (levelComplete) drawLevelComplete();

        requestAnimationFrame(gameLoop);
    }

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        buildLevel();
        resetMario();
        gameRunning = true;
        frameCount = 0;
        updateUI();
        gameLoop();
    }

    function restartGame() {
        coins = 0;
        score = 0;
        lives = 3;
        gameOver = false;
        levelComplete = false;
        particles = [];
        camera.x = 0;
        buildLevel();
        resetMario();
        updateUI();
    }

    function resizeCanvas() {
        let maxW = Math.min(800, window.innerWidth - 20);
        let ratio = 500 / 800;
        let maxH = maxW * ratio;
        canvas.style.width = maxW + 'px';
        canvas.style.height = maxH + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    </script>
</body>
</html>
